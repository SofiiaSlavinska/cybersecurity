<!DOCTYPE html>
<html lang="en">
<head><title>SecureMail Pro</title></head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>SecureMail Pro (HTTPS Enabled)</h2>
    <div id="login-section">
        <input type="text" id="login-user" placeholder="admin">
        <input type="password" id="login-pass" placeholder="password123">
        <button onclick="login()">Login Securely</button>
    </div>
    <div id="email-container" style="display: none;">
        <h3 style="color: green;">Успішний вхід через зашифрований канал!</h3>
        <ul id="email-list"></ul>
    </div>
    <script src="/main.js"></script>
</body>
</html>
