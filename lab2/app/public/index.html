<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureMail Pro</title>
    <link rel="stylesheet" href="http://localhost:6000/theme.css">
</head>
<body>
    <div class="logo-container">
        <img src="http://localhost:6000/logo.png" alt="Logo">
    </div>
    
    <h2 id="username">John Smith</h2>

    <div style="display: flex;">
        <div id="sidebar" style="width: 30%; border-right: 1px solid black; padding: 10px;">

            <h3>Email Content</h3>

    <script src="main.js"></script>
    
    <script src="http://localhost:6000/react-mock.js"></script>
    <script src="http://localhost:4000/support.js"></script>
